<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>✅ Basic HTML and CSS Quiz</h1>
    </header>
    <main>
        <form action="">
            <fieldset>
                <legend>Personal Information</legend>
                <div class="form-item column2"><label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="John Doe"
                      required>
                </div>
                <div class="form-item column2">
                    <label for="email">Email:</label>
                    <input type="email" name="useremail" id="email" placeholder="johndoe@gmail.com"
                      required>
                </div>

            </fieldset>

            <fieldset>
                <legend>Questions</legend>
                <div class="form-item column2"><label for="q1">
                        <span>1.</span>What does the acronym CSS stand for?
                    </label>
                    <input type="text" id="q1" name="q1" required>
                </div>
                <div class="form-item"><label for="q2">
                        <span>2.</span>How are id and class attributes selected in CSS?
                    </label>
                    <textarea name="q2" id="q2" placeholder="..." rows="5"></textarea>
                </div>
                <div class="form-item column1"><label for="q3">
                        <span>3.</span>Which of the following is a valid CSS comment?
                    </label>
                    <select name="q3" id="q3">
                        <option value="" selected disabled>Choose One ...</option>
                        <option value="a">A. &lt;!-- This is a comment --&gt;</option>
                        <option value="b">B. /* This is a comment */</option>
                        <option value="c">C. &lt;!-- This is comment */</option>
                    </select>
                </div>
                <div class="form-item column2">
                    <label for="q4">
                        <span>4.</span>What is the bottom margin given this declaration?
                    </label>
                    <code>margin: 10px 5px 15px;</code>
                    <input type="number" id="q4" name="q4" required>
                </div>
            </fieldset>
            <button type="submit">Submit Quiz</button>
        </form>
    </main>
    <footer></footer>
</body>

</html>
