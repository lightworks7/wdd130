<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description"
      content="Our Contact Us page makes it easy to connect with us for adventure planning and customer support. Get in touch with us.">
    <meta name="author" content="Clement Light">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header class="head-split">
        <a href="index.html" rel="noopener"><img src="images/wwr-logo.jpeg" alt="wwr logo"
              width="100"></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="contact-top">
            <h1>Rapids White Water Rafting</h1>
            <div>
                <p>Address: 75 Hospital Road, Aba<br>Abia State, Nigeria</p>
                <p>Phone Number: +234 915 404 0440</p>
                <p>Email: info@rapidwhitewater.com</p>
            </div>

        </div>
        <section class="contact-grid">
            <h2>Contact Us</h2>
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3973.9613682293293!2d7.366499509605008!3d5.10992903795464!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x10429948c04dbd45%3A0x40adb886d1d9e65e!2s75%20Hospital%20Rd%2C%20Aba%2C%20450211%2C%20Abia!5e0!3m2!1sen!2sng!4v1790602155743!5m2!1sen!2sng"
                  width="400" height="420" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form>
                <div class="form-item column2"><label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>
                <div class="form-item column2">
                    <label for="email">Email:</label>
                    <input type="email" name="useremail" id="email" placeholder="johndoe@gmail.com"
                      required>
                </div>

                <div>
                    <fieldset class="form-item column2">
                        <p class="label-legend">
                            Message Purpose
                        </p>
                        <div>
                            <input type="radio" id="general" name="purpose">
                            <label for="general">General Inquiry</label>
                        </div>
                        <div><input type="radio" id="reservation" name="purpose">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div><input type="radio" id="suggestion" name="purpose">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </fieldset>
                </div>

                <div class="form-item"><label for="feedback">Message</label>
                    <textarea name="feedback" id="feedback" placeholder="Type here"
                      rows="5"></textarea>
                </div>
                <div class="form-item" id="sub-check"><label for="subscription">Please
                        Subscribe
                        me to the monthly newsletter</label>
                    <input type="checkbox" id="subscription" name="subscription">
                </div>

                <button type="submit">Get in Touch!</button>

            </form>
        </section>

        <section class="contact-bottom">

            <h2>We Are Here to Serve You</h2>
            <div class="com-pictures">
                <figure class="pic"><img src="images/coast-guards.jpg" alt="wwr coast guards">
                    <figcaption>Our Coast Guards</figcaption>
                </figure>
                <figure class="pic"><img src="images/raft-engineers.jpg" alt="wwr engineers">
                    <figcaption>Our Engineers</figcaption>
                </figure>
                <figure class="pic"><img src="images/tour-guides.jpg" alt="wwr tour guides">
                    <figcaption>Our Tour Guides</figcaption>
                </figure>
            </div>
        </section>

    </main>
    <footer>
        <p>&copy;2026 Rapids White Water Rafting | Clement Light</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com" target="_blank" rel="noopener"><img
                  src="images/facebook-logo.png" alt="facebook logo" width="25"></a>
            <a href="https://www.youtube.com" target="_blank" rel="noopener"><img
                  src="images/youtube-logo.jpg" alt="youtube logo" width="35"></a>
            <a href="https://www.linkedin.com" target="_blank" rel="noopener"><img
                  src="images/linkedin-logo.jpg" alt="linkedin logo" width="25"></a>
        </nav>
    </footer>

</body>

</html>
